<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XYLO | Get Key</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
  :root {
    --bg: #0a0a0c; --card-bg: #121216; --border: #26262d;
    --fg: #ffffff; --fg2: #8a8a93; --accent: #ffffff;
    --font: 'Inter', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    background-color: var(--bg); color: var(--fg); font-family: var(--font); 
    display: flex; align-items: center; justify-content: center; min-height: 100vh; 
    background-image: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 20px 20px; padding: 20px;
  }
  
  .container { 
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; 
    padding: 40px 30px; width: 100%; max-width: 420px; 
    box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    text-align: center; position: relative;
  }

  .title { font-size: 32px; font-weight: 800; letter-spacing: 1px; margin-bottom: 10px; }
  .subtitle { font-size: 13px; color: var(--fg2); margin-bottom: 30px; }
  
  .btn { 
    width: 100%; padding: 14px; background: transparent; color: var(--fg); border: 1px solid var(--border); 
    border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; 
    transition: 0.2s; text-transform: uppercase; letter-spacing: 0.5px; 
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn:hover { background: rgba(255,255,255,0.05); }
  .btn-primary { background: #1a1a20; border-color: #333; }
  
  .links { margin-top: 25px; font-size: 12px; display: flex; flex-direction: column; gap: 15px; }
  .links a { color: var(--fg2); text-decoration: none; transition: 0.2s; }
  .links a:hover { color: var(--fg); }

  /* MODAL STYLES */
  .modal-overlay { 
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; 
    align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); 
  }
  .modal-overlay.active { display: flex; }
  .modal { 
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; 
    padding: 30px; width: 100%; max-width: 420px; text-align: center;
  }
  .modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
  .modal p { font-size: 13px; color: var(--fg2); margin-bottom: 25px; }
  
  .gateway-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px; border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 10px; cursor: pointer; transition: 0.2s; background: transparent;
  }
  .gateway-item:hover { background: rgba(255,255,255,0.03); border-color: #444; }
  .gateway-name { font-size: 14px; font-weight: 600; }
  .gateway-desc { font-size: 12px; color: var(--fg2); }
  .cancel-btn { margin-top: 15px; color: var(--fg2); }

  /* KEY REVEAL */
  .key-box { display: none; margin-top: 20px; }
  .key-text { font-family: monospace; font-size: 24px; font-weight: 700; color: #fff; letter-spacing: 2px; margin: 15px 0; }
</style>
</head>
<body>

<div class="container">
  <div class="title">GET KEY</div>
  <div class="subtitle" id="subtitleText">Complete the verification to generate your access key.</div>

  <!-- Normal View -->
  <div id="normalView">
    <button class="btn btn-primary" onclick="openGateway()">GENERATE KEY</button>
    <div class="links">
      <a href="#">Already have a key? → Dashboard</a>
      <a href="#">Game Status →</a>
    </div>
  </div>

  <!-- Key Reveal Area -->
  <div class="key-box" id="keyBox">
    <div class="subtitle" style="margin-bottom: 0;">Your Access Key:</div>
    <div class="key-text" id="keyDisplay">XYLO-XXXX-XXXX-XXXX</div>
    <button class="btn" style="background:#fff; color:#000; border:none;" onclick="copyKey()">Copy Key</button>
  </div>
</div>

<!-- GATEWAY MODAL -->
<div class="modal-overlay" id="gatewayModal">
  <div class="modal">
    <h3>Choose Gateway</h3>
    <p>Select a verification provider to continue</p>

    <div class="gateway-item" onclick="goToLink('workink')">
      <div class="gateway-name">Work.ink</div>
      <div class="gateway-desc">2 checkpoints</div>
    </div>

    <div class="gateway-item" onclick="goToLink('linkvertise')">
      <div class="gateway-name">Linkvertise</div>
      <div class="gateway-desc">2 checkpoints</div>
    </div>

    <div class="gateway-item" onclick="goToLink('lootlabs')">
      <div class="gateway-name">LootLab</div>
      <div class="gateway-desc">2 checkpoints</div>
    </div>

    <button class="btn cancel-btn" onclick="closeGateway()">Cancel</button>
  </div>
</div>

<script>
  // ==========================================
  // FIREBASE CONFIGURATION
  // ==========================================
  const FB_URL = "https://xylo-hub-default-rtdb.firebaseio.com";

  // ==========================================
  // TOTOONG LINKS MO
  // ==========================================
  const LINKS = {
    workink: "https://work.ink/37kG/system-patch-notes-v118",
    linkvertise: "https://link-center.net/10374345/J7CgllXQEo2d",
    lootlabs: "https://lootdest.org/s?Y0ebLnek"
  };

  // ANTI-BYPASS LOGIC
  const urlParams = new URLSearchParams(window.location.search);
  const isVerified = urlParams.get('verified');

  if (isVerified === 'true') {
    document.getElementById('normalView').style.display = 'none';
    document.getElementById('subtitleText').innerText = "Verification Complete! Generating your key...";
    generateKey();
  }

  // Anti-tamper: I-disable yung right click at devtools shortcuts
  document.addEventListener('contextmenu', event => event.preventDefault());
  document.onkeydown = function(e) {
    if (e.keyCode == 123) return false; // F12
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'I'.charCodeAt(0)) return false; // Ctrl+Shift+I
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'C'.charCodeAt(0)) return false; // Ctrl+Shift+C
    if (e.ctrlKey && e.shiftKey && e.keyCode == 'J'.charCodeAt(0)) return false; // Ctrl+Shift+J
    if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false; // Ctrl+U
  }

  function openGateway() { document.getElementById('gatewayModal').classList.add('active'); }
  function closeGateway() { document.getElementById('gatewayModal').classList.remove('active'); }

  function goToLink(provider) {
    closeGateway();
    window.location.href = LINKS[provider]; 
  }

  function generateKey() {
    setTimeout(() => {
      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let key = 'XYLO-';
      for(let i=0; i<3; i++) {
        for(let j=0; j<4; j++) key += chars[Math.floor(Math.random()*chars.length)];
        if(i<2) key += '-';
      }
      
      const now = Date.now();
      const expiryTime = now + (5 * 60 * 60 * 1000); // 5 Hours
      const keyId = key.replace(/[^A-Z0-9]/g, '');

      const keyData = {
        key: key, hwid: null, uses: 0, maxUses: 1,
        expiry: new Date(expiryTime).toISOString(),
        revoked: false, createdBy: "FreeGenerator", createdAt: now
      };

      fetch(`${FB_URL}/keys/${keyId}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(keyData)
      }).then(() => {
        document.getElementById('keyBox').style.display = 'block';
        document.getElementById('keyDisplay').innerText = key;
        document.getElementById('subtitleText').innerText = "Your key is ready!";
      }).catch((err) => {
        alert("Connection failed. Please try again.");
        window.location.href = "getkey.html"; 
      });
    }, 1500); 
  }

  function copyKey() {
    const keyText = document.getElementById('keyDisplay').innerText;
    navigator.clipboard.writeText(keyText).then(() => alert("Key Copied to clipboard!"));
  }
</script>
</body>
</html>
