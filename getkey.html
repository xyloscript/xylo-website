<script>
  let tasksDone = { 1: false, 2: false, 3: false, 4: false, 5: false };
  let currentKey = "";
  let expiryTime = 0;
  
  // I-load ang progress mula sa sessionStorage para hindi mawala pag nag-refresh
  let savedProgress = JSON.parse(sessionStorage.getItem('xylo_progress') || '{}');
  let taskStartTime = savedProgress.tasks || { 1: 0, 2: 0, 3: 0, 4: 0 };
  let tasksDoneSaved = savedProgress.done || { 1: false, 2: false, 3: false, 4: false, 5: false };
  
  // Pagsamahin ang saved tasksDone
  for(let i=1; i<=5; i++) {
    if (tasksDoneSaved[i]) tasksDone[i] = true;
  }

  let keysDB = JSON.parse(localStorage.getItem('xylo_keys_final') || '[]');
  function saveDB() { localStorage.setItem('xylo_keys_final', JSON.stringify(keysDB)); }

  function saveProgress() {
    sessionStorage.setItem('xylo_progress', JSON.stringify({ tasks: taskStartTime, done: tasksDone }));
  }

  function updateUI() {
    let count = 0;
    for (let i = 1; i <= 5; i++) {
      const el = document.getElementById('task-' + i);
      if (tasksDone[i]) {
        el.classList.add('completed');
        el.classList.remove('cooldown');
        const timerTxt = document.getElementById('timer-' + i);
        if (timerTxt) timerTxt.style.display = 'none';
        
        if (i !== 5) el.querySelector('.task-desc').innerText = "Completed ✓";
        else document.getElementById('task5-desc').innerText = "Verified ✓";
        count++;
      }
    }
    document.getElementById('taskCount').innerText = `Completed ${count} of 5`;

    if (count === 5) {
      const btn = document.getElementById('claimBtn');
      btn.disabled = false;
      btn.classList.add('btn-green');
      btn.innerText = "🔓 Claim Reward";
    }
  }

  // START TASK LOGIC - Pure Timer, no warning
  function startTask(id, link, duration) {
    if (tasksDone[id]) return; 
    
    // Kung may tumatakbo nang timer para dito, huwag nang i-restart
    if (taskStartTime[id] > 0 && (Date.now() - taskStartTime[id]) < (duration * 1000)) {
      // Naka-open na yung tab, babalik na lang siya
      return;
    }

    window.open(link, '_blank');
    
    const el = document.getElementById('task-' + id);
    const desc = el.querySelector('.task-desc');
    const timerTxt = document.getElementById('timer-' + id);
    
    // I-save ang start time
    taskStartTime[id] = Date.now();
    saveProgress();
    
    el.classList.add('cooldown');
    desc.innerText = "Complete the task...";
    timerTxt.style.display = 'block';
    
    // I-start ang countdown
    runCountdown(id, duration);
  }

  function runCountdown(id, duration) {
    const el = document.getElementById('task-' + id);
    const desc = el.querySelector('.task-desc');
    const timerTxt = document.getElementById('timer-' + id);
    
    if (tasksDone[id]) return;

    el.classList.add('cooldown');
    timerTxt.style.display = 'block';
    
    const updateTimer = () => {
      let timeSpent = Math.floor((Date.now() - taskStartTime[id]) / 1000);
      let timeLeft = duration - timeSpent;

      if (timeLeft <= 0) {
        // Tapos na ang timer!
        clearInterval(timerInterval);
        tasksDone[id] = true;
        saveProgress();
        
        el.classList.remove('cooldown');
        timerTxt.style.display = 'none';
        
        updateUI();
        
        // WALANG WARNING, mag-didisplay lang ng success modal para sa confirmation
        showWarning("✅", "Task Completed!", "Great job! You can now proceed to the next task.");
        return;
      }

      timerTxt.innerText = timeLeft + "s";
      desc.innerText = "Please wait " + timeLeft + "s...";
    };

    updateTimer(); // I-run agad
    const timerInterval = setInterval(updateTimer, 1000);
  }

  // Pagbalik sa page, i-check kung may mga existing timers na tumatakbo
  window.addEventListener('load', () => {
    for (let i = 1; i <= 4; i++) {
      if (tasksDone[i]) continue;
      if (taskStartTime[i] > 0) {
        let duration = 0;
        if (i === 1) duration = 50;
        if (i === 2) duration = 40;
        if (i === 3) duration = 30;
        if (i === 4) duration = 30;

        let timeSpent = Math.floor((Date.now() - taskStartTime[i]) / 1000);
        if (timeSpent < duration) {
          // I-resume yung countdown
          runCountdown(i, duration);
        } else {
          // Tapos na pala habang wala siya
          tasksDone[i] = true;
          saveProgress();
        }
      }
    }
    updateUI();
  });

  function openCloudflare() {
    if (tasksDone[5]) return;
    document.getElementById('cfModal').classList.add('active');
    document.getElementById('cfSpinner').style.display = 'block';
    document.getElementById('cfCheckmark').style.display = 'none';
    document.getElementById('cfText').innerText = "Verifying...";
    document.getElementById('cfText').style.color = "#232323";
    document.getElementById('cfBtn').disabled = true;
    document.getElementById('cfBtn').classList.remove('btn-green');

    setTimeout(() => {
      document.getElementById('cfSpinner').style.display = 'none';
      document.getElementById('cfCheckmark').style.display = 'block';
      document.getElementById('cfText').innerText = "Success!";
      document.getElementById('cfText').style.color = "#22c55e";
      document.getElementById('cfBtn').disabled = false;
      document.getElementById('cfBtn').classList.add('btn-green');
    }, 3000);
  }

  function cfContinue() {
    document.getElementById('cfModal').classList.remove('active');
    tasksDone[5] = true;
    saveProgress();
    updateUI();
    showWarning("✅", "Human Verified!", "Thank you for confirming you are human.");
  }

  function claimReward() {
    let count = 0;
    for (let i = 1; i <= 5; i++) if (tasksDone[i]) count++;
    if (count < 5) return;

    currentKey = generateKey();
    expiryTime = new Date().getTime() + (5 * 60 * 60 * 1000);
    
    keysDB.push({ 
      key: currentKey, hwid: "Not Used", expiry: new Date(expiryTime).toISOString() 
    });
    saveDB();

    document.getElementById('keyDisplay').innerText = currentKey;
    document.getElementById('keyBox').style.display = 'block';
    document.getElementById('claimBtn').style.display = 'none';
    startTimer();
  }

  function generateKey() {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let key = 'XYLO-';
    for(let i=0; i<3; i++) {
      for(let j=0; j<4; j++) key += chars[Math.floor(Math.random()*chars.length)];
      if(i<2) key += '-';
    }
    return key;
  }

  function startTimer() {
    const timerDisplay = document.getElementById('timerDisplay');
    setInterval(() => {
      const now = new Date().getTime();
      const distance = expiryTime - now;
      if (distance < 0) { timerDisplay.innerText = "EXPIRED"; timerDisplay.style.color = "var(--acc)"; return; }
      const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
      const s = Math.floor((distance % (1000 * 60)) / 1000);
      timerDisplay.innerText = `Expires in ${h}h ${m}m ${s}s`;
    }, 1000);
  }

  function copyKey() { navigator.clipboard.writeText(currentKey).then(() => alert("Key Copied!")); }
  
  function showWarning(icon, title, msg) {
    document.getElementById('modalIcon').innerText = icon;
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalMessage').innerText = msg;
    document.getElementById('warningModal').classList.add('active');
  }
  function closeWarning() { document.getElementById('warningModal').classList.remove('active'); }
</script>
